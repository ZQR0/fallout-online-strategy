# Пример structure одного файла changelog'а для новой таблицы.
# Имя файла: db/changelog/changes/2026-09-02-001-create-orders-table.yaml
databaseChangeLog:
  - changeSet:
      id: 2026-09-02-001-create-orders-table
      author: yaroslav
      comment: "Создание таблицы orders"
      changes:
        - createTable:
            tableName: orders
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  generationType: ALWAYS   # identity-колонка, НЕ serial
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: customer_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_orders_customer
                    references: customers(id)
              - column:
                  name: status
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: total_amount
                  type: numeric(12,2)     # не money
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz       # не timestamp / не timestamp(0)
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - addCheckConstraint:
            tableName: orders
            constraintName: chk_orders_status
            checkCondition: "status in ('pending','paid','shipped','cancelled')"
      rollback:
        - dropTable:
            tableName: orders
