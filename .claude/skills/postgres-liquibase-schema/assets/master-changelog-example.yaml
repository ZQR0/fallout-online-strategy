# Пример корневого (master) changelog'а, который подключает отдельные файлы изменений.
# Имя файла: db/changelog/db.changelog-master.yaml
databaseChangeLog:
  - include:
      file: db/changelog/changes/2026-09-02-001-create-orders-table.yaml
      relativeToChangelogFile: false
  - include:
      file: db/changelog/changes/2026-09-02-002-create-order-items-table.yaml
      relativeToChangelogFile: false

# Правила структуры:
# - один файл changeSet'а = одно логическое изменение (одна таблица / один индекс / один constraint)
# - имя файла: <YYYY-MM-DD>-<порядковый номер за день>-<короткое описание в kebab-case>.yaml
# - id changeSet'а совпадает с именем файла без расширения
# - master changelog только подключает файлы через include, сам DDL не содержит
